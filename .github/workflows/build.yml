name: Build Magic.TXD (prebuilt Qt)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  QT_VERSION: 5.15.2
  QT_ROOT: C:\Qt

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python (for aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}\${{ env.QT_VERSION }}
          key: qt-${{ env.QT_VERSION }}-win64_msvc2019_64

      - name: Install prebuilt Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2019_64 -O $env:QT_ROOT

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # The newest MSVC (14.4x) rejects a C++20 concept check in
      # vendor/eirrepo/sdk/Map.h, so prefer the VS2019 toolset (v142,
      # MSVC 14.29) when the runner has it, and fall back to v143.
      - name: Pick MSVC toolset
        id: toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "Visual Studio: $vs"
          Write-Host "Installed MSVC versions:"
          Get-ChildItem "$vs\VC\Tools\MSVC" | ForEach-Object { Write-Host "  $($_.Name)" }
          $toolsets = Get-ChildItem "$vs\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\*" -Directory | Select-Object -ExpandProperty Name -Unique
          Write-Host "Platform toolsets: $($toolsets -join ', ')"
          $pick = if ($toolsets -contains 'v142') { 'v142' } else { 'v143' }
          Write-Host "Using $pick"
          "name=$pick" >> $env:GITHUB_OUTPUT

      # The project's "Use system Qt" option (build/customprops.xml) links the
      # dynamic Qt from <QT_ROOT>\<version>\msvc2019_64 instead of the
      # from-source static Qt in vendor/Qt5.15.
      - name: Build solution (Release x64)
        shell: pwsh
        run: >
          msbuild build\Magic.sln -m
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=${{ steps.toolset.outputs.name }}
          /p:MGTXD_WIN32_SYSTEM_QT=true
          /p:MGTXD_WIN32_SYSTEM_QT_PATH=$env:QT_ROOT
          /p:MGTXD_WIN32_SYSTEM_QT_VERSION=$env:QT_VERSION

      # README "Step 4": the output folder needs resources, languages and data
      # next to the executable. windeployqt adds the Qt DLLs and plugins.
      - name: Assemble output folder
        shell: pwsh
        run: |
          $out = "output"
          Get-ChildItem $out
          Copy-Item resources, languages, data -Destination $out -Recurse -Force
          & "$env:QT_ROOT\$env:QT_VERSION\msvc2019_64\bin\windeployqt.exe" --release --no-translations "$out\magictxd_x64.exe"
          Get-ChildItem $out -Recurse -Include *.pdb, *.lib, *.exp, *.ipdb, *.iobj | Remove-Item -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: magictxd-x64-qt${{ env.QT_VERSION }}
          path: output
          if-no-files-found: error
