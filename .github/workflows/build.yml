name: Build Magic.TXD (prebuilt Qt)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  QT_VERSION: 5.15.2
  QT_ROOT: C:\Qt

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python (for aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}\${{ env.QT_VERSION }}
          key: qt-${{ env.QT_VERSION }}-win64_msvc2019_64

      - name: Install prebuilt Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2019_64 -O $env:QT_ROOT

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # The vendored C++20 code only compiles with an early VS2022 compiler:
      # MSVC 14.44 (runner default) rejects a concept check in
      # vendor/eirrepo/sdk/Map.h, and MSVC 14.29 (v142) rejects the concepts
      # in vendor/rwlib. Install an early v143 MSVC side by side (the
      # upstream repo dates from May 2022, the MSVC 14.31/14.32 era) and
      # build every project with it.
      - name: Install early VS2022 MSVC toolset
        id: toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $candidates = @(
            @{ id = 'Microsoft.VisualStudio.Component.VC.14.32.17.2.x86.x64'; ver = '14.32' },
            @{ id = 'Microsoft.VisualStudio.Component.VC.14.31.17.1.x86.x64'; ver = '14.31' },
            @{ id = 'Microsoft.VisualStudio.Component.VC.14.34.17.4.x86.x64'; ver = '14.34' },
            @{ id = 'Microsoft.VisualStudio.Component.VC.14.36.17.6.x86.x64'; ver = '14.36' },
            @{ id = 'Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64'; ver = '14.38' }
          )
          $picked = $null
          foreach ($c in $candidates) {
            Write-Host "Trying $($c.id)"
            $p = Start-Process $installer -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', $c.id, '--quiet', '--norestart', '--nocache') -Wait -PassThru
            Write-Host "  installer exit code $($p.ExitCode)"
            $dir = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object Name -like "$($c.ver).*" | Select-Object -First 1
            if ($dir) { $picked = $dir.Name; break }
          }
          Write-Host "Installed MSVC versions:"
          Get-ChildItem "$vs\VC\Tools\MSVC" | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not $picked) { throw "Could not install an early v143 MSVC toolset" }
          Write-Host "Using MSVC $picked"
          "vctools=$picked" >> $env:GITHUB_OUTPUT

      # The project's "Use system Qt" option (build/customprops.xml) links the
      # dynamic Qt from <QT_ROOT>\<version>\msvc2019_64 instead of the
      # from-source static Qt in vendor/Qt5.15.
      - name: Build solution (Release x64)
        shell: pwsh
        run: >
          msbuild build\Magic.sln -m
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:VCToolsVersion=${{ steps.toolset.outputs.vctools }}
          /p:MGTXD_WIN32_SYSTEM_QT=true
          /p:MGTXD_WIN32_SYSTEM_QT_PATH=$env:QT_ROOT
          /p:MGTXD_WIN32_SYSTEM_QT_VERSION=$env:QT_VERSION

      # README "Step 4": the output folder needs resources, languages and data
      # next to the executable. windeployqt adds the Qt DLLs and plugins.
      - name: Assemble output folder
        shell: pwsh
        run: |
          $out = "output"
          Get-ChildItem $out
          Copy-Item resources, languages, data -Destination $out -Recurse -Force
          & "$env:QT_ROOT\$env:QT_VERSION\msvc2019_64\bin\windeployqt.exe" --release --no-translations "$out\magictxd_x64.exe"
          Get-ChildItem $out -Recurse -Include *.pdb, *.lib, *.exp, *.ipdb, *.iobj | Remove-Item -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: magictxd-x64-qt${{ env.QT_VERSION }}
          path: output
          if-no-files-found: error
